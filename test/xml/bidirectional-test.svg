<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="250" y="30" text-anchor="middle" font-family="Arial" font-size="20" fill="#333">
        Bi-directional Sync Test
    </text>

    <!-- Test elements with clear IDs -->
    <circle cx="100" cy="100" r="30" fill="red" stroke="black" stroke-width="2" id="red-circle">
        <title>Red Circle - Click to test sync</title>
    </circle>

    <rect x="200" y="70" width="60" height="60" fill="blue" stroke="black" stroke-width="2" id="blue-rectangle">
        <title>Blue Rectangle - Click to test sync</title>
    </rect>

    <polygon points="350,70 380,130 320,130" fill="green" stroke="black" stroke-width="2" id="green-triangle">
        <title>Green Triangle - Click to test sync</title>
    </polygon>

    <!-- Elements with classes -->
    <circle cx="100" cy="200" r="25" fill="orange" class="highlight-element" stroke="black" stroke-width="2">
        <title>Orange Circle with class</title>
    </circle>

    <rect x="200" y="175" width="50" height="50" fill="purple" class="highlight-element selectable" stroke="black" stroke-width="2">
        <title>Purple Rectangle with multiple classes</title>
    </rect>

    <!-- Grouped elements -->
    <g id="shape-group" transform="translate(50, 280)">
        <circle cx="50" cy="50" r="20" fill="cyan" stroke="navy" stroke-width="1" id="grouped-circle"/>
        <rect x="100" y="30" width="40" height="40" fill="yellow" stroke="navy" stroke-width="1" id="grouped-rect"/>
    </g>

    <!-- Instructions -->
    <text x="250" y="360" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">
        Instructions: Select elements in text editor or click shapes in preview
    </text>
</svg>

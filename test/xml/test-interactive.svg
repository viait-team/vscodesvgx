<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="400" height="300" fill="#f0f8ff" stroke="#333" stroke-width="2"/>

    <!-- Title -->
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">
        Interactive SVG Demo
    </text>

    <!-- Shapes Group -->
    <g id="shapes" transform="translate(50, 60)">
        <!-- Circle -->
        <circle cx="60" cy="60" r="40" fill="#ff6b6b" stroke="#333" stroke-width="2" id="circle1">
            <title>Red Circle</title>
        </circle>

        <!-- Rectangle -->
        <rect x="150" y="20" width="80" height="80" fill="#4ecdc4" stroke="#333" stroke-width="2" id="rect1">
            <title>Blue Rectangle</title>
        </rect>

        <!-- Triangle (using polygon) -->
        <polygon points="280,100 320,20 360,100" fill="#45b7d1" stroke="#333" stroke-width="2" id="triangle1">
            <title>Blue Triangle</title>
        </polygon>
    </g>

    <!-- Interactive Elements -->
    <g id="interactive" transform="translate(50, 180)">
        <!-- Star shape -->
        <polygon points="50,10 61,35 86,35 67,52 73,77 50,65 27,77 33,52 14,35 39,35"
                 fill="#ffd93d" stroke="#333" stroke-width="2" id="star1">
            <title>Yellow Star</title>
        </polygon>

        <!-- Ellipse -->
        <ellipse cx="200" cy="40" rx="60" ry="25" fill="#ff9ff3" stroke="#333" stroke-width="2" id="ellipse1">
            <title>Pink Ellipse</title>
        </ellipse>

        <!-- Path -->
        <path d="M 300 20 Q 340 5 380 20 Q 360 40 340 45 Q 320 50 300 20 Z"
              fill="#6bcf7f" stroke="#333" stroke-width="2" id="path1">
            <title>Green Path</title>
        </path>
    </g>

    <!-- Instructions -->
    <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">
        Click on shapes to select them • Use Ctrl+Click for multi-selection • Try zoom and pan
    </text>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Interactive SVG Preview</title>
    <script type="importmap">
    {
        "imports": {
            "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
        }
    }
    </script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            font-family: var(--vscode-editor-font-family);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #svg-container {
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--vscode-widget-border);
            background-color: var(--vscode-editor-background);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        #svg-container.loading {
            background-image: linear-gradient(45deg, transparent 25%, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.1) 50%, transparent 50%, transparent 75%, rgba(255,255,255,0.1) 75%);
            background-size: 20px 20px;
            animation: loading 1s linear infinite;
        }

        @keyframes loading {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }

        .status {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--vscode-badge-background);
            color: var(--vscode-badge-foreground);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            z-index: 100;
        }

        .error {
            color: var(--vscode-errorForeground);
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Root container for SVG content -->
        <div id="root"></div>
    </div>

    <!-- Initialize VS Code API before loading modules -->
    <script>
        // Provide the VS Code API with the expected name for preview webview
        if (typeof window.previewAcquireVsCodeApi === 'undefined') {
            window.previewAcquireVsCodeApi = acquireVsCodeApi;
        }
    </script>

    <script type="module" src="{{scriptUri}}"></script>
</body>
</html>

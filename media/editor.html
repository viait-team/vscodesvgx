
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVGX Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #svg-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="svg-container"></div>
    <button id="save-button" style="position: absolute; top: 10px; right: 10px;">Save</button>

    <script>
        const vscode = acquireVsCodeApi();

        const svgContainer = d3.select('#svg-container');

        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.type) {
                case 'update':
                    const svgContent = message.text;
                    svgContainer.html(svgContent);
                    svgContainer.select('rect').on('click', function() {
                        d3.select(this).attr('fill', 'blue');
                    });
                    break;
            }
        });

        document.getElementById('save-button').addEventListener('click', () => {
            const svgContent = svgContainer.html();
            vscode.postMessage({
                type: 'edit',
                content: svgContent
            });
        });
    </script>
</body>
</html>
